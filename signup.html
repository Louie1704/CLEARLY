<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Get started with Clearly. Choose a plan and sign up to organize projects and collaborate with your team.">
        <title>Get Started | Clearly</title>
        <link href="styles.css" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    </head>
<body>
    <header class="navbar">
        <p class="nav-text">Clearly</p>
      <navbar class="links">
        <a href="./index.html">Home</a>
        <a href="./feature.html">Features</a>
        <a href="./pricing.html">Pricing</a>
        <a href="./faq.html">FAQ</a>
      </navbar>
    </header>

    <div class="heading">
        <h1>Get started with Clearly</h1>
        <p>Choose a plan and tell us where to reach you. You can change your plan at any time.</p>
    </div>
    
    <div class="sign-up-container">
    <form class="sign-up-form" action="#" method="post">

        <div class="field">
            <label for="name">
                Full Name:
            </label>
            <input id="name" type="text" name="name" placeholder="e.g Patrick Maro" required/>
        </div>

        <div class="field">
            <label for="email">
                Email Address:
            </label>
            <input id="email" type="email" name="email" placeholder="example@gmail.com" required/>
            <p class="hint">We'll send your confirmation here</p>
        </div>

        <div class="field">
            <label for="plan">
                Plan
                <select id="plan" name="plan">
                    <option value="free">Free ($0/month)</option>
                    <option value="pro" selected>Pro ($12/month)</option>
                    <option value="team">Team ($29/month)</option>
                </select>
            </label>
        </div>

        <div class="consent">
            <input type="checkbox" id="consent" name="checkbox"/>
            <label for="consent" class="consent-label">I agree to the <a href="./terms.html">Terms and Conditions</a> and the <a href="./privacy.html">Privacy Policy</a></label>
        </div>

        <button class="form-btn" type="submit" method="post">Get Started</button>
    </form>
    </div>

    <p class="faq-paragraph">Questions first? Read the <a href="./faq.html">FAQ</a>.</p>
    
    <footer>

        <a href="mailto:patrickmaro95@gmail.com">Contact</a>
        <a href="tel:+2348165307261">Call Us</a>
      </nav>
    </footer>
</body>
</html>
